name: Validate registry

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-registry.mjs

  verify-changed-plugins:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download DotCraft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo DotHarness/dotcraft --pattern 'DotCraft-*-linux-x64.tar.gz' --dir "$RUNNER_TEMP/dotcraft"
          tar -xzf "$RUNNER_TEMP"/dotcraft/*.tar.gz -C "$RUNNER_TEMP/dotcraft"
          echo "DOTCRAFT=$(find "$RUNNER_TEMP/dotcraft" -type f -name dotcraft | head -n 1)" >> "$GITHUB_ENV"
      - name: Verify changed plugins
        run: |
          failed=0
          for id in $(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- plugins | cut -d/ -f2 | sort -u); do
            [ -d "plugins/$id" ] || continue
            echo "Verifying $id"
            "$DOTCRAFT" plugin verify --candidate "plugins/$id" --for-publish || failed=1
          done
          exit "$failed"
